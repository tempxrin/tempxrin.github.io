name: Build CV PDF

on:
  push:
    paths:
      - 'resume/cv.tex'
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: resume
          root_file: cv.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv
          path: resume/cv.pdf

      - name: Commit PDF
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add resume/cv.pdf
          git commit -m "build: compile CV PDF [skip ci]" || echo "No changes to commit"
          git push
